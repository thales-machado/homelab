apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lan
  namespace: gateway
spec:
  gatewayClassName: cilium
  # pinned: Pi-hole records point here, so the address cannot move on recreation
  addresses:
    - type: IPAddress
      value: 192.168.15.241
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.lan.thalespm.me"
      tls:
        mode: Terminate
        certificateRefs:
          - name: lan-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
