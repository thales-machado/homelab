# Proven against staging on 2026-11-23, then moved to production.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lan-wildcard
  namespace: gateway
spec:
  secretName: lan-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.lan.thalespm.me"
