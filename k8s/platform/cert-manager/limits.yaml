apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: cert-manager
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 10m
        memory: 32Mi
      default:
        memory: 192Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: cert-manager
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.memory: 1Gi
