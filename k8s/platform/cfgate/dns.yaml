apiVersion: cfgate.io/v1alpha1
kind: CloudflareDNS
metadata:
  name: seireitei
  namespace: cfgate-edge
spec:
  tunnelRef:
    name: seireitei
  # thalespm.me joined on 2026-11-24, with the first route in it. DockFlare
  # still owns every other hostname in that zone, which is safe because cfgate
  # refuses to touch a record carrying no owner marker of its own.
  zones:
    - name: thalesmachado.net
    - name: thalespm.me
  source:
    gatewayRoutes:
      enabled: true
      # matchNames, not labels: alpha.11 requires label presence even for an
      # empty value, so explicit names fail loudly instead of silently wide.
      namespaceSelector:
        matchNames:
          - cfgate-edge
          - thalesmachado-net
          - it-tools
  defaults:
    # A tunnel CNAME only works proxied.
    proxied: true
  cleanupPolicy:
    deleteOnRouteRemoval: true
    deleteOnResourceRemoval: true
