# Public path for the site, through the cfgate tunnel. The apex moved here on
# 2026-11-23: there is one writer per hostname, so the service left zangetsu's
# include and DockFlare's rule was expired before cfgate could own the record.
# www stays as a permanent alias, decided the same day; removing it would be
# one line here and the record would go with it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thalesmachado-net-public
  namespace: thalesmachado-net
spec:
  parentRefs:
    - name: public
      namespace: cfgate-edge
      sectionName: http
  hostnames:
    - thalesmachado.net
    - www.thalesmachado.net
  rules:
    - backendRefs:
        - name: thalesmachado-net
          port: 80
