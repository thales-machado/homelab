apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: thalesmachado-net
  namespace: thalesmachado-net
spec:
  endpointSelector: {}
  ingress:
    # kubelet probes arrive as host. The Gateway's proxy does NOT: Cilium gives
    # Envoy the reserved "ingress" identity, so a policy that only allows host
    # drops every request from the Gateway with a connect timeout, while the
    # node itself still reaches the pod (2026-11-23).
    - fromEntities:
        - host
        - ingress
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # nginx resolves uptime-kuma.lan.thalespm.me through the Pi-hole VIP, not
    # through CoreDNS: that resolver is baked into the image's config.
    - toCIDR:
        - 192.168.15.248/32
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # 443 is Traefik, for the two Uptime Kuma endpoints; 9120 is komodo-core,
    # for the sidecar.
    - toCIDR:
        - 192.168.15.214/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "9120"
              protocol: TCP
