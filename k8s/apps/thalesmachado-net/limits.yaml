apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: thalesmachado-net
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 10m
        memory: 32Mi
      default:
        memory: 96Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: thalesmachado-net
spec:
  hard:
    requests.cpu: 200m
    requests.memory: 128Mi
    limits.memory: 256Mi
