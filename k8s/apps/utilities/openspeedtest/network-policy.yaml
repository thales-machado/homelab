apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openspeedtest
  namespace: openspeedtest
spec:
  endpointSelector: {}
  ingress:
    # kubelet probes arrive as host; the Gateway's Envoy carries the reserved
    # "ingress" identity, which is neither host nor a pod.
    - fromEntities:
        - host
        - ingress
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
