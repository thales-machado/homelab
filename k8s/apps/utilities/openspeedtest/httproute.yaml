# LAN only: this service has no public route today and gains none here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openspeedtest
  namespace: openspeedtest
spec:
  parentRefs:
    - name: lan
      namespace: gateway
  hostnames:
    - speedtest.lan.thalespm.me
  rules:
    - backendRefs:
        - name: openspeedtest
          port: 80
