apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: it-tools
  namespace: it-tools
spec:
  endpointSelector: {}
  ingress:
    # kubelet probes arrive as host; the Gateway's Envoy carries the reserved
    # "ingress" identity, which is neither host nor a pod.
    - fromEntities:
        - host
        - ingress
    # The public path arrives from an ordinary pod in cfgate-edge, so it
    # carries neither of those identities.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cfgate-edge
            app.kubernetes.io/name: cloudflared
            app.kubernetes.io/managed-by: cfgate
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
