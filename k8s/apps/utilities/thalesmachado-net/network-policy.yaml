apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: thalesmachado-net
  namespace: thalesmachado-net
spec:
  endpointSelector: {}
  ingress:
    # kubelet probes arrive as "host", but the Gateway's Envoy proxy gets
    # Cilium's reserved "ingress" identity - host-only here drops every
    # Gateway request with a connect timeout (2026-11-23).
    - fromEntities:
        - host
        - ingress
    # The public path arrives from an ordinary pod in cfgate-edge, so it carries
    # neither of those identities and needs its own rule.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cfgate-edge
            app.kubernetes.io/name: cloudflared
            app.kubernetes.io/managed-by: cfgate
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # nginx resolves uptime-kuma.lan.thalespm.me through the Pi-hole VIP, not
    # through CoreDNS: that resolver is baked into the image's config.
    - toCIDR:
        - 192.168.15.248/32
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # 443 is Traefik, for the two Uptime Kuma endpoints; 9120 is komodo-core,
    # for the sidecar.
    - toCIDR:
        - 192.168.15.214/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "9120"
              protocol: TCP
