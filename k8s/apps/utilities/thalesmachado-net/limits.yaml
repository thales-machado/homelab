apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: thalesmachado-net
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 10m
        memory: 32Mi
      default:
        memory: 96Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: thalesmachado-net
spec:
  # Sized for two pods: a rolling update runs new+old side by side, so a
  # steady-state-only quota stalls the very rollout it's meant to bound.
  hard:
    requests.cpu: 200m
    requests.memory: 256Mi
    limits.memory: 512Mi
