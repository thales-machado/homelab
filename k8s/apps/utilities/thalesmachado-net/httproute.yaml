# Phase 1: internal name only. The public route stays on the Docker container
# through DockFlare until this one is proven.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thalesmachado-net
  namespace: thalesmachado-net
spec:
  parentRefs:
    - name: lan
      namespace: gateway
  hostnames:
    - thalesmachado.lan.thalespm.me
  rules:
    - backendRefs:
        - name: thalesmachado-net
          port: 80
