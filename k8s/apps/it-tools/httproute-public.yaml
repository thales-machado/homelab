# Public path, through the cfgate tunnel. The DockFlare rule for this hostname
# has to be expired before the record can be created: one writer per hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: it-tools-public
  namespace: it-tools
spec:
  parentRefs:
    - name: public
      namespace: cfgate-edge
      sectionName: http
  hostnames:
    - it-tools.thalespm.me
  rules:
    - backendRefs:
        - name: it-tools
          port: 80
