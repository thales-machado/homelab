apiVersion: v1
kind: Service
metadata:
  name: openspeedtest
  namespace: openspeedtest
spec:
  selector:
    app: openspeedtest
  ports:
    - name: http
      port: 80
      # numeric, like every other Service here: a named targetPort does not
      # survive the path Cilium's Gateway takes to build its Envoy cluster
      targetPort: 3000
