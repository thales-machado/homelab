# Applied by hand, like root.yaml: the project has to exist before any
# Application that names it, including root.
# Apply: kubectl apply -f k8s/argocd/project.yaml
# sourceRepos is the list of repositories this cluster trusts. Adding a chart
# repository is a commit here, on purpose.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
spec:
  description: seireitei workloads
  sourceRepos:
    - https://github.com/thales-machado/homelab
    - https://github.com/kubernetes-sigs/gateway-api
    - https://charts.jetstack.io
    - https://prometheus-community.github.io/helm-charts
    - oci://ghcr.io/cfgate/charts/cfgate
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
