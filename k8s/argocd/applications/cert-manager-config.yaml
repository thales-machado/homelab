# Separate from the chart because ClusterIssuer is a CRD the chart installs:
# a later sync wave, so the kind exists before Argo applies one.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: homelab
  source:
    repoURL: https://github.com/thales-machado/homelab
    targetRevision: main
    path: k8s/platform/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
