# Gateway API CRDs, standard channel, straight from upstream at a pinned tag:
# no vendored copy to drift. v1.6.3 is what Cilium 1.20.5 expects; a mismatch
# makes the operator fail on a kube-proxy-free cluster, which is this one.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: homelab
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api
    targetRevision: v1.6.3
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      # no prune: deleting a CRD deletes every object of that kind with it
      prune: false
      selfHeal: true
    syncOptions:
      # CRDs of this size exceed the client-side apply annotation limit
      - ServerSideApply=true
