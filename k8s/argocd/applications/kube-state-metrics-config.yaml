apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: homelab
  source:
    repoURL: https://github.com/thales-machado/homelab
    targetRevision: main
    path: k8s/platform/kube-state-metrics
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-state-metrics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
