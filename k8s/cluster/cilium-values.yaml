# Cilium for seireitei: CNI, kube-proxy replacement and L2 announcements.
# Install: helm install cilium cilium/cilium --version <v> -n kube-system \
#            -f k8s/cluster/cilium-values.yaml
# Chart 1.20.5, installed 2026-11-23. Check for a newer one at upgrade time
# (helm search repo cilium/cilium --versions) rather than reusing this number.

# kube-proxy was skipped at kubeadm init, so Cilium has to carry service routing.
# Without k8sServiceHost/Port the agent cannot reach the API server: the
# kubernetes ClusterIP it would normally use is the very thing it provides.
kubeProxyReplacement: true
k8sServiceHost: 192.168.15.215
k8sServicePort: 6443

ipam:
  mode: kubernetes

# Needs the Gateway API CRDs already installed (v1.6.3, by Argo) and
# kubeProxyReplacement above. Enabling it restarts the operator and the agent.
gatewayAPI:
  enabled: true

# L2 announcements answer ARP for LoadBalancer addresses on the LAN, replacing
# MetalLB. They churn leases, which is why the client rate limit goes up.
l2announcements:
  enabled: true
k8sClientRateLimit:
  qps: 20
  burst: 40

operator:
  replicas: 1

# Single node: nothing to spread across, and Hubble stays off until something
# runs that is worth observing.
hubble:
  enabled: false
