name: immich-album-naming
description: Normalizes Immich album and folder names to <Description> - MM-YYYY - the DAG runs on zangetsu and executes remotely over SSH, where Immich and the external library live (Dagu has no per-step remote DOCKER_HOST)

schedule: "CRON_TZ=America/Sao_Paulo 0 4 * * 0"

steps:
  - name: sync
    retry_policy:
      limit: 3
      interval_sec: 900
    action: ssh.run
    with:
      user: keydrop
      host: 192.168.15.215
      port: 22
      key: /opt/homelab-ssh/id_ed25519
      known_host_file: /opt/homelab-ssh/known_hosts
      strict_host_key: true
      # Explicit shell: see restic-backup-urahara.yaml (same ssh.run
      # pattern, same Dagu unescape quirk).
      shell: /bin/sh
      command: >-
        docker run --rm
        -v /opt/homelab/scripts:/opt/homelab/scripts:ro
        -v /opt/homelab/hosts/urahara/.env:/opt/homelab/hosts/urahara/.env:ro
        -v /mnt/media/immich/external:/mnt/immich-external
        --network cloudflare-net
        python:3-alpine
        sh -c "pip install --quiet --root-user-action=ignore --disable-pip-version-check requests && python3 /opt/homelab/scripts/immich/immich-create-albums-from-folders.py --rename-folders && wget -q -O /dev/null http://192.168.15.214:8000/ping/4e49bf4f-73d0-478c-8575-d18b3d311609 || { wget -q -O /dev/null http://192.168.15.214:8000/ping/4e49bf4f-73d0-478c-8575-d18b3d311609/fail; exit 1; }"
