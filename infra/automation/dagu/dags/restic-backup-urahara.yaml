name: restic-backup-urahara
description: Daily Restic backup of /opt and /etc on urahara - the DAG runs on zangetsu and executes remotely over SSH (Dagu has no per-step remote DOCKER_HOST)

schedule: "CRON_TZ=America/Sao_Paulo 45 2 * * *"

steps:
  - name: backup
    retry_policy:
      limit: 3
      interval_sec: 900
    action: ssh.run
    with:
      user: keydrop
      host: 192.168.15.215
      port: 22
      key: /opt/homelab-ssh/id_ed25519
      known_host_file: /opt/homelab-ssh/known_hosts
      strict_host_key: true
      # Explicit shell: without it Dagu runs its own unescape pass before
      # sending the command over SSH, breaking the \$ used below to defer
      # variable expansion to the shell inside the container. ssh.run goes
      # through a real remote shell, unlike docker.run, which talks to the
      # Docker API directly, so unescaped $(...) and $VAR were expanded
      # before the container existed.
      shell: /bin/sh
      command: >-
        docker run --rm
        -v /opt/homelab/scripts:/opt/homelab/scripts:ro
        -v /opt/homelab/hosts/urahara/.env:/opt/homelab/hosts/urahara/.env:ro
        -v /opt:/source/opt:ro
        -v /etc:/source/etc:ro
        -v /mnt/backup/urahara:/repo
        --network cloudflare-net
        alpine:3
        sh -c "envf=/opt/homelab/hosts/urahara/.env; export RESTIC_PASSWORD=\$(grep \"^RESTIC_PASSWORD=\" \$envf | cut -d= -f2-); apk add --no-cache --quiet restic && sh /opt/homelab/scripts/backup/backup-restic.sh urahara && wget -q -O /dev/null http://192.168.15.214:8000/ping/b12ec69a-b294-47fb-a137-03eb45ff6a12 || { wget -q -O /dev/null http://192.168.15.214:8000/ping/b12ec69a-b294-47fb-a137-03eb45ff6a12/fail; exit 1; }"
