name: n8n-backup-urahara
description: Consistent daily backup of the n8n SQLite database plus a per-workflow export/rename (n8n runs on urahara, reached by ssh.run like restic-backup-urahara, before Restic at 02:45)

schedule: "CRON_TZ=America/Sao_Paulo 35 2 * * *"

steps:
  - name: backup
    retry_policy:
      limit: 3
      interval_sec: 900
    action: ssh.run
    with:
      user: keydrop
      host: 192.168.15.215
      port: 22
      key: /opt/homelab-ssh/id_ed25519
      known_host_file: /opt/homelab-ssh/known_hosts
      strict_host_key: true
      shell: /bin/sh
      command: >-
        docker run --rm
        -v /opt/homelab/scripts:/opt/homelab/scripts:ro
        -v /opt/apps/n8n:/opt/apps/n8n
        alpine:3
        sh -c "apk add --no-cache --quiet sqlite && sh /opt/homelab/scripts/backup/backup-n8n-sqlite.sh"

  # n8n's own CLI export needs the `n8n` binary, so it cannot run in the
  # alpine container above. It writes one JSON per workflow, named by ID
  # only; the next step renames them using the workflow name from the API.
  - name: export-n8n-workflows
    depends:
      - backup
    retry_policy:
      limit: 3
      interval_sec: 900
    action: ssh.run
    with:
      user: keydrop
      host: 192.168.15.215
      port: 22
      key: /opt/homelab-ssh/id_ed25519
      known_host_file: /opt/homelab-ssh/known_hosts
      strict_host_key: true
      shell: /bin/sh
      # The official n8n image does not expose `sh` in its entrypoint (only
      # `n8n` subcommands as argv), confirmed in production with
      # "Error: Command \"sh\" not found", hence no sh -c here. The output
      # directory already exists and belongs to uid 1000 because of the
      # previous "backup" step.
      command: >-
        docker run --rm
        -v /opt/apps/n8n:/home/node/.n8n
        n8nio/n8n:latest
        export:workflow --backup --output=/home/node/.n8n/db-backup/workflows-json/

  - name: rename-n8n-workflow-backups
    depends:
      - export-n8n-workflows
    retry_policy:
      limit: 3
      interval_sec: 900
    action: ssh.run
    with:
      user: keydrop
      host: 192.168.15.215
      port: 22
      key: /opt/homelab-ssh/id_ed25519
      known_host_file: /opt/homelab-ssh/known_hosts
      strict_host_key: true
      # Explicit shell: without it Dagu undoes the \$ escaping before
      # sending the command over SSH (same quirk as restic-backup-urahara),
      # so $envf and $(...) would be expanded by the remote shell before the
      # container even exists.
      shell: /bin/sh
      command: >-
        docker run --rm
        -v /opt/homelab/scripts:/opt/homelab/scripts:ro
        -v /opt/homelab/hosts/urahara/.env:/opt/homelab/hosts/urahara/.env:ro
        -v /opt/apps/n8n:/opt/apps/n8n
        --network cloudflare-net
        alpine:3
        sh -c "apk add --no-cache --quiet curl jq && envf=/opt/homelab/hosts/urahara/.env; export N8N_API_KEY=\$(grep '^N8N_API_KEY=' \$envf | cut -d= -f2-); sh /opt/homelab/scripts/backup/rename-n8n-workflow-backups.sh && wget -q -O /dev/null http://192.168.15.214:8000/ping/781d4a87-e153-4aba-a206-818b6e94ce0c || { wget -q -O /dev/null http://192.168.15.214:8000/ping/781d4a87-e153-4aba-a206-818b6e94ce0c/fail; exit 1; }"
