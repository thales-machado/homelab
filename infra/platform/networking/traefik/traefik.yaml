# Traefik - private reverse proxy for *.lan.thalespm.me, LAN and VPN only.
# zangetsu services route by Docker label, urahara services through the file
# provider (config/dynamic/), since the Docker provider only sees local
# containers. Certificates: Let's Encrypt DNS-01 via Cloudflare.
# See docs/traefik-dockflare.md.
services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 256m
    pids_limit: 128
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - /opt/apps/traefik/dynamic:/etc/traefik/dynamic:ro
      - /opt/apps/traefik/acme:/etc/traefik/acme
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      # Reuses DockFlare's token (Zone:DNS:Edit on the zone). A dedicated
      # CF_DNS_API_TOKEN would isolate the scope.
      - CLOUDFLARE_DNS_API_TOKEN=${CF_API_TOKEN}
      # lego's default 120s is not enough for the first wildcard issuance
      # (shared TXT name, cached by public resolvers). docs/traefik-dockflare.md.
      - CLOUDFLARE_PROPAGATION_TIMEOUT=300
      - CLOUDFLARE_POLLING_INTERVAL=5
    networks:
      - cloudflare-net
    labels:
      # Pinned: v3.5 and older ship a Docker client fixed at API 1.24, which
      # breaks against Docker 29+. No Watchtower label, bumped by hand.
      # This is the only router with tls.domains: it issues the single
      # wildcard that every other router then reuses by SNI.
      traefik.enable: "true"
      traefik.http.routers.traefik-dashboard.rule: "Host(`traefik.lan.thalespm.me`)"
      traefik.http.routers.traefik-dashboard.entrypoints: "websecure"
      traefik.http.routers.traefik-dashboard.tls.certresolver: "cloudflare"
      traefik.http.routers.traefik-dashboard.tls.domains[0].main: "lan.thalespm.me"
      traefik.http.routers.traefik-dashboard.tls.domains[0].sans: "*.lan.thalespm.me"
      traefik.http.routers.traefik-dashboard.middlewares: "crowdsec@file,security-headers@file"
      traefik.http.routers.traefik-dashboard.service: "api@internal"
