apiVersion: 1

contactPoints:
    - orgId: 1
      name: whatsapp-homelab-alerts
      receivers:
        - uid: ffswege1dbkzkc
          type: webhook
          settings:
            url: http://192.168.15.215:8094/message/sendText/homelab
            httpMethod: POST
            authorization_scheme: ""
            headers:
                apikey: ${EVOLUTION_API_KEY}
            payload:
                # The message is built into a variable and emitted with printf "%q",
                # which produces a JSON-safe quoted string. Interpolating the summary
                # directly into "text" breaks the payload whenever it contains a double
                # quote, a newline or a backslash: the webhook answers 400 and the alert
                # is lost silently (seen with the container-restart and OOM rules, whose
                # summaries quote the container name).
                template: |
                    {{- $msg := "✅ *RESOLVED*" -}}
                    {{- if eq .Status "firing" -}}{{- $msg = "🚨 *ALERT*" -}}{{- end -}}
                    {{- range .Alerts -}}
                    {{- $host := "" -}}
                    {{- if .Labels.host -}}{{- $host = printf "[%s] - " .Labels.host -}}{{- end -}}
                    {{- $msg = printf "%s\n*%s%s*\n%s" $msg $host .Labels.shortname .Annotations.summary -}}
                    {{- end -}}
                    {"number": "${GRAFANA_ALERT_WHATSAPP_JID}", "text": {{ $msg | printf "%q" }}}
          disableResolveMessage: false
    - orgId: 1
      name: n8n-oom-autorestart
      receivers:
        - uid: ffswege1dbkzkd
          type: webhook
          settings:
            url: https://n8n.lan.thalespm.me/webhook/homelab-notify
            httpMethod: POST
            authorization_scheme: ""
            headers:
                x-homelab-secret: ${N8N_WEBHOOK_SECRET}
          disableResolveMessage: true
