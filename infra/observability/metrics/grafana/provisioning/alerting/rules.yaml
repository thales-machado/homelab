apiVersion: 1

groups:
    - orgId: 1
      name: homelab
      folder: Homelab Alerts
      interval: 1m
      rules:
        - uid: disk-full
          title: Disk almost full
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint='/'} / node_filesystem_size_bytes{mountpoint='/'})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 85
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            summary: '{{ $values.A.Value }}% used on root disk (threshold 85%)'
          labels:
            severity: warning
            shortname: DISK
          isPaused: false
        - uid: cpu-temp
          title: High CPU temperature
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: node_thermal_zone_temp{zone='0'}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 75
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            summary: '{{ $values.A.Value }}°C (threshold 75°C)'
          labels:
            severity: warning
            shortname: CPU
          isPaused: false
        - uid: ram-high
          title: High RAM usage
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 90
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            summary: '{{ $values.A.Value }}% used (threshold 90%)'
          labels:
            severity: warning
            shortname: RAM
          isPaused: false
        - uid: target-down
          title: Monitoring target down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: up
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            summary: '[{{ $labels.job }}] - {{ if (lt $values.A.Value 1.0) }}{{ $labels.instance }} not responding{{ else }}{{ $labels.instance }} responding again{{ end }}'
          labels:
            severity: warning
            shortname: SERVICE
          isPaused: false
        - uid: mount-immich-active
          title: Immich mount (NAS) down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: node_filesystem_device_error{mountpoint='/mnt/media/immich'}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 5m
          annotations:
            summary: '[immich] - NAS CIFS mount (/mnt/media/immich) unreachable or with device error'
          labels:
            severity: warning
            shortname: MOUNT
          isPaused: false
        - uid: mount-immich-space
          title: Immich mount (NAS) space high
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint='/mnt/media/immich'} / node_filesystem_size_bytes{mountpoint='/mnt/media/immich'})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 85
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            summary: '[immich] - {{ $values.A.Value }}% used (threshold 85%)'
          labels:
            severity: warning
            shortname: MOUNT
          isPaused: false
        - uid: mount-remote-active
          title: Google Drive mount (rclone) down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: node_filesystem_device_error{mountpoint='/mnt/remote'}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 5m
          annotations:
            summary: '[gdrive] - rclone mount (/mnt/remote) unreachable or with device error (quota makes the space check unreliable)'
          labels:
            severity: warning
            shortname: MOUNT
          isPaused: false
        - uid: mount-paperless-active
          title: Paperless mount (NAS) down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: node_filesystem_device_error{mountpoint='/mnt/media/paperless'}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 5m
          annotations:
            summary: '[paperless] - NAS CIFS mount (/mnt/media/paperless) unreachable or with device error'
          labels:
            severity: warning
            shortname: MOUNT
          isPaused: false
        - uid: mount-paperless-space
          title: Paperless mount (NAS) space high
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint='/mnt/media/paperless'} / node_filesystem_size_bytes{mountpoint='/mnt/media/paperless'})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 85
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            summary: '[paperless] - {{ $values.A.Value }}% used (threshold 85%)'
          labels:
            severity: warning
            shortname: MOUNT
          isPaused: false
        - uid: mount-backup-active
          title: Backup mount (Restic) down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: node_filesystem_device_error{mountpoint=~'/mnt/backup/.*'}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 5m
          annotations:
            summary: '[backup-restic] - NAS CIFS mount (/mnt/backup) unreachable or with device error'
          labels:
            severity: warning
            shortname: MOUNT
          isPaused: false
        - uid: mount-backup-space
          title: Backup mount (Restic) space high
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint=~'/mnt/backup/.*'} / node_filesystem_size_bytes{mountpoint=~'/mnt/backup/.*'})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 85
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            summary: '[backup-restic] - {{ $values.A.Value }}% used (threshold 85%)'
          labels:
            severity: warning
            shortname: MOUNT
          isPaused: false
        - uid: mount-retro-active
          title: games-4tb disk (retro/Wolf) down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: node_filesystem_device_error{mountpoint='/mnt/games-4tb'}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 5m
          annotations:
            summary: '[games-4tb] - local disk mount (/mnt/games-4tb) unreachable or with device error'
          labels:
            severity: warning
            shortname: MOUNT
          isPaused: false
        - uid: container-restart
          title: Container restarted
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                # container_start_time_seconds is the creation time (does not
                # change on in-place restarts). An in-place restart resets the
                # CPU counter in the same series; a recreate is a new series.
                expr: resets(container_cpu_usage_seconds_total{name!="",cpu="total"}[5m])
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 0s
          annotations:
            summary: '[{{ $labels.host }}] - container *{{ $labels.name }}* restarted {{ $values.A.Value }}x in the last 5min'
          labels:
            severity: warning
            shortname: RESTART
          isPaused: false
        - uid: nebula-sync-failed
          title: Nebula Sync failed (Pi-hole replica)
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: efswmxbcxua68c
              model:
                queryType: instant
                # the container stays Up when the sync aborts; only the log shows it
                expr: 'sum(count_over_time({container="nebula-sync"} |= "Sync failed" [10m]))'
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 0s
          annotations:
            summary: '[nebula-sync] - sync with the replica (urahara) failed - check the container logs'
          labels:
            severity: warning
            shortname: PIHOLE
            host: zangetsu
          isPaused: false
        - uid: container-oom
          title: Container OOM killed
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: increase(container_oom_events_total{name!=""}[5m])
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 0s
          annotations:
            summary: '[{{ $labels.host }}] - container *{{ $labels.name }}* was OOM killed {{ printf "%.0f" $values.A.Value }} time(s) in the last 5min'
          labels:
            severity: warning
            shortname: OOM
          isPaused: false
        - uid: traefik-backend-down
          title: Traefik cannot connect to a backend
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: efswmxbcxua68c
              model:
                queryType: instant
                expr: 'sum by (backend) (count_over_time({container="traefik"} |~ "connect: connection refused" | json | label_format backend=routerName [5m]))'
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 3
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 1m
          annotations:
            summary: '[{{ $labels.backend }}] - {{ $values.A.Value }} failures in the last 5m'
          labels:
            severity: warning
            shortname: TRAEFIK
            host: zangetsu
          isPaused: false
        - uid: unifi-ap-down
          title: AP UniFi offline
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                # Time since the last sample per AP (keeps the "name" label).
                # Never drops out of the query the way count(uptime_seconds)
                # did; that old approach got stuck before "resolved", because
                # a vanished series has no new value to re-evaluate.
                # last_over_time+timestamp() gives a continuous per-device
                # staleness signal: rises when the AP stops reporting, back
                # to ~0 when it reconnects.
                expr: time() - timestamp(last_over_time(unpoller_device_uptime_seconds{type="uap"}[24h]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 300
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 1m
          annotations:
            summary: '{{ $labels.name }} - {{ if (gt $values.A.Value 300.0) }}offline{{ else }}back online{{ end }}'
          labels:
            severity: warning
            shortname: UNIFI
            host: AP
          isPaused: false
        - uid: unifi-wan-down
          title: UniFi uplink/WAN degraded
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: unpoller_wan_uptime_percentage
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 99
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            summary: '[{{ $labels.wan_name }}] - uptime {{ $values.A.Value }}% (expected ≥99%)'
          labels:
            severity: warning
            shortname: UNIFI
            host: WAN
          isPaused: false
        # Lab Kubernetes cluster (platform-engineering-labs, k8s/local), probed
        # from here on purpose: an alert living inside that cluster dies with it.
        # Its control plane was down 41h once and nothing noticed (PM-0006).
        - uid: k8s-lab-apiserver-down
          title: K8s lab API server unreachable
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: probe_success{job="blackbox-k8s-lab"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 2m
          annotations:
            summary: 'Lab API server /readyz failing for 2m: pods keep running, nothing can change in the cluster. Check the static pods with crictl on the node (PM-0006).'
          labels:
            severity: critical
            shortname: K8SLAB
          isPaused: false
        - uid: k8s-lab-app-down
          title: K8s lab app not answering
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: probe_success{instance="https://app.lab.thalespm.me/healthz"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 2m
          annotations:
            summary: 'app.lab.thalespm.me/healthz failing for 2m. If the API server alert is quiet, the problem is the app, Traefik or the LoadBalancer IP.'
          labels:
            severity: critical
            shortname: K8SLAB
          isPaused: false
        # Rules below read the in-cluster Prometheus directly (datasource
        # k8slabprom001), so they see pods and nodes rather than only the two
        # black-box probes above. Each one comes from a postmortem.
        - uid: k8s-lab-control-plane-restart
          title: K8s lab control plane container restarted
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 900
                to: 0
              datasourceUid: k8slabprom001
              model:
                expr: sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace="kube-system", pod=~"etcd-.*|kube-apiserver-.*|kube-controller-manager-.*|kube-scheduler-.*"}[15m]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            summary: 'Control plane pod *{{ $labels.pod }}* restarted in the last 15min. Expected during maintenance, otherwise read PM-0006 (etcd crashed on a corrupted image layer and nobody noticed for 41h).'
          labels:
            severity: critical
            shortname: K8SLAB
          isPaused: false
        - uid: k8s-lab-node-not-ready
          title: K8s lab node not Ready
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: k8slabprom001
              model:
                expr: kube_node_status_condition{condition="Ready", status="true"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 5m
          annotations:
            summary: 'Node *{{ $labels.node }}* is not Ready for 5min. Pods on it will be evicted after the toleration window.'
          labels:
            severity: critical
            shortname: K8SLAB
          isPaused: false
        - uid: k8s-lab-crashloop
          title: K8s lab pod in CrashLoopBackOff
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: k8slabprom001
              model:
                expr: sum by (namespace, pod) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            summary: 'Pod *{{ $labels.pod }}* in namespace *{{ $labels.namespace }}* has been in CrashLoopBackOff for 10min (PM-0001).'
          labels:
            severity: warning
            shortname: K8SLAB
          isPaused: false
        - uid: k8s-lab-calico-node-restart
          title: K8s lab calico-node restarting
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 1800
                to: 0
              datasourceUid: k8slabprom001
              model:
                expr: sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace="calico-system"}[30m]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 2
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            summary: 'calico-node pod *{{ $labels.pod }}* restarted more than twice in 30min. Networking on that node is unstable (PM-0002).'
          labels:
            severity: warning
            shortname: K8SLAB
          isPaused: false
        - uid: k8s-lab-no-lb-announcement
          title: K8s lab LoadBalancer IP not announced
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: k8slabprom001
              model:
                expr: sum(metallb_speaker_announced) or vector(0)
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 5m
          annotations:
            summary: 'No MetalLB speaker is announcing any LoadBalancer IP. Traefik is unreachable on its address even if its pods are healthy, which is PM-0005. The lab always has at least one LoadBalancer Service, so zero means trouble.'
          labels:
            severity: critical
            shortname: K8SLAB
          isPaused: false
        - uid: k8s-lab-cross-node-network
          title: K8s lab pod-to-pod traffic between nodes failing
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: k8slabprom001
              model:
                expr: min(probe_success{path="cross-node"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 3m
          annotations:
            summary: 'A pod on urahara cannot reach a pod on zangetsu for 3min. Compare with the same-node probe: if that one passes, the CNI between the nodes is broken while both nodes still report Ready (PM-0003).'
          labels:
            severity: critical
            shortname: K8SLAB
          isPaused: false
        # The two rules below read the homelab node-exporter, not the cluster:
        # the weekly integrity check writes its result as a textfile metric on
        # each host, so it still reports when the cluster is down, which is the
        # state PM-0006 spent 41h in.
        - uid: k8s-lab-binary-mismatch
          title: K8s lab binary differs from its baseline
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: lab_binary_integrity
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            summary: 'On *{{ $labels.host }}* the binary *{{ $labels.binary }}* no longer matches its baseline. containerd never verifies the extracted file, only the compressed layer, and that gap is what PM-0006 ran into. Do not restart that container before reading the postmortem.'
          labels:
            severity: critical
            shortname: K8SLAB
          isPaused: false
        - uid: k8s-lab-integrity-check-stale
          title: K8s lab integrity check has not run
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: time() - lab_binary_check_timestamp_seconds
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 691200
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 1h
          annotations:
            summary: 'The weekly binary integrity check on *{{ $labels.host }}* has not run for more than 8 days. A textfile metric keeps serving its last value forever, so a silent timer looks exactly like a healthy one.'
          labels:
            severity: warning
            shortname: K8SLAB
          isPaused: false
        - uid: k8s-lab-cert-expiring
          title: K8s lab certificate expiring soon
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: k8slabprom001
              model:
                expr: (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 15
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 1h
          annotations:
            summary: 'Certificate *{{ $labels.name }}* expires in less than 15 days. Renewal is automatic, so this firing means renewal has been failing, and every site behind that certificate breaks when it runs out.'
          labels:
            severity: warning
            shortname: K8SLAB
          isPaused: false
        - uid: k8s-lab-pod-restarting
          title: K8s lab pod restarting repeatedly
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: k8slabprom001
              model:
                expr: sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[1h]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 5
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 15m
          annotations:
            summary: 'Pod *{{ $labels.pod }}* in *{{ $labels.namespace }}* restarted more than 5 times in an hour. A pod that crashes and recovers never enters CrashLoopBackOff, so the other rule stays quiet: cert-manager-cainjector reached 491 restarts unnoticed (PM-0001).'
          labels:
            severity: warning
            shortname: K8SLAB
          isPaused: false

# Orphan rules removed via file (deleteRules). Grafana does not delete a
# file-provisioned rule just because it disappeared from groups: above
# (known, documented bug; X-Disable-Provenance does not work for deleting via
# the API, confirmed in production when removing caddy-backend-down after the
# move to Traefik). They must be declared here.
deleteRules:
    - orgId: 1
      uid: caddy-backend-down
    # Covered by the Uptime Kuma TCP monitor on 47989
    - orgId: 1
      uid: wolf-down
