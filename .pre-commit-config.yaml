# Install once per clone: pip install pre-commit && pre-commit install
# Run over everything: pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # 1.38+ reads files in binary mode; earlier versions use the locale
  # encoding and crash on Windows (cp1252) on any file with an emoji.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml, -f, parsable]

  # shellcheck-py, not koalaman/shellcheck-precommit: that one is a Docker
  # hook and fails on any machine without a running Docker daemon.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-S, warning]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Local hook: the table is generated from this repo's own include: lists, so
  # there is nothing to pull from upstream. language: python, not system, so
  # pre-commit supplies the interpreter: this repo is committed from WSL and
  # from Windows, and `python3` does not exist on the second. The same check
  # runs in CI, which covers a clone without `pre-commit install`.
  - repo: local
    hooks:
      - id: inventory
        name: README service inventory is current
        entry: python scripts/inventory/inventory.py --check
        language: python
        pass_filenames: false
        files: ^(docker/hosts/.*\.ya?ml|k8s/apps/.*|scripts/inventory/.*\.py|README\.md)$
