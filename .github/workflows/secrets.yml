name: secrets

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a leak introduced before this workflow existed is still found.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a secret removed from HEAD is still in the commits.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_SUMMARY: "true"
