# Redeploys the homelab-zangetsu / homelab-urahara Komodo stacks through
# their HMAC listener, with the per-host path filter done here because the
# listener has none.
#
# homelab-urahara has its own webhook_secret (set on the Stack);
# homelab-zangetsu leaves the field empty and falls back to the Core's global
# KOMODO_WEBHOOK_SECRET, so each GitHub secret below must match whichever the
# Stack actually uses. Both stacks use webhook_force_deploy: true (see
# komodo.yaml for the DeployStackIfChanged bug).
#
# Instead of a static path filter, this reads the include: of each
# docker/hosts/<host>/compose.yaml to know which docker/services/ fragments
# that host really uses, and triggers a stack only when a changed file falls
# inside one of them (or inside its own docker/hosts/<host>/). A fragment
# included by both hosts triggers both; a host-exclusive fragment triggers
# only that host.
#
# Two executions, not one. Files under scripts/ and terraform/ have to exist in
# /opt/homelab, but no container is built from them, so they get /refresh
# (RefreshStackCache: clone and diff only) instead of a deploy that walks the
# whole stack. Anything that changes a compose fragment still gets /deploy.
name: Deploy Homelab

on:
  push:
    branches: [main]
    paths:
      - "docker/hosts/zangetsu/**"
      - "docker/hosts/urahara/**"
      - "docker/services/**"
      - "scripts/**"
      - "terraform/**"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      zangetsu: ${{ steps.detect.outputs.zangetsu }}
      urahara: ${{ steps.detect.outputs.urahara }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect affected hosts
        id: detect
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"

          # Collect the docker/services/ paths referenced by include:, skipping
          # commented lines and local overrides without the ../../ prefix
          # (already covered by the docker/hosts/<host>/ match), then reduce
          # each to its fragment directory.
          get_prefixes() {
            grep -E '^\s*-\s*\.\./\.\./[^#[:space:]]' "$1" \
              | sed -E 's/^\s*-\s*//; s/\s*#.*$//; s|^\.\./\.\./|docker/|' \
              | xargs -n1 dirname | sort -u
          }

          Z_PREFIXES=$(get_prefixes docker/hosts/zangetsu/compose.yaml)
          U_PREFIXES=$(get_prefixes docker/hosts/urahara/compose.yaml)

          # Prints the execution this host needs: deploy, refresh or none.
          match_host() {
            local hostdir="$2"
            local result=none
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in "$hostdir"/*) echo deploy; return ;; esac
              # scripts/ and terraform/ belong to no include: list. Without a
              # rule of their own they never reach the host at all, and both
              # hosts keep whatever they happened to have when some unrelated
              # service last changed. They do not justify recreating anything.
              case "$f" in scripts/*|terraform/*) result=refresh; continue ;; esac
              while IFS= read -r p; do
                [ -z "$p" ] && continue
                case "$f" in "$p"/*|"$p") echo deploy; return ;; esac
              done <<< "$1"
            done <<< "$CHANGED"
            echo "$result"
          }

          echo "zangetsu=$(match_host "$Z_PREFIXES" docker/hosts/zangetsu)" >> "$GITHUB_OUTPUT"
          echo "urahara=$(match_host "$U_PREFIXES" docker/hosts/urahara)" >> "$GITHUB_OUTPUT"

  deploy-zangetsu:
    needs: detect-changes
    if: needs.detect-changes.outputs.zangetsu != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komodo (homelab-zangetsu)
        env:
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_HOMELAB_ZANGETSU_WEBHOOK_SECRET }}
        run: |
          BODY='{"ref":"refs/heads/main","repository":{"full_name":"${{ github.repository }}"}}'
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" | sed 's/^.* //')
          EXEC="${{ needs.detect-changes.outputs.zangetsu }}"
          curl -sf -X POST "https://komodo.thalespm.me/listener/github/stack/${{ vars.KOMODO_ZANGETSU_STACK_ID }}/$EXEC" \
            -H "Content-Type: application/json" \
            -H "X-Github-Event: push" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            --data-raw "$BODY"

  deploy-urahara:
    needs: detect-changes
    if: needs.detect-changes.outputs.urahara != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komodo (homelab-urahara)
        env:
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_HOMELAB_URAHARA_WEBHOOK_SECRET }}
        run: |
          BODY='{"ref":"refs/heads/main","repository":{"full_name":"${{ github.repository }}"}}'
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" | sed 's/^.* //')
          EXEC="${{ needs.detect-changes.outputs.urahara }}"
          curl -sf -X POST "https://komodo.thalespm.me/listener/github/stack/${{ vars.KOMODO_URAHARA_STACK_ID }}/$EXEC" \
            -H "Content-Type: application/json" \
            -H "X-Github-Event: push" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            --data-raw "$BODY"
