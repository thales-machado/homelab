name: Sync Pi-hole DNS

on:
  push:
    branches:
      - main
    paths:
      - 'docker/services/platform/networking/pi-hole/config/pihole-dns.yaml'

jobs:
  sync:
    name: Trigger Pi-hole DNS sync via n8n
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Trigger n8n webhook
        run: |
          PAYLOAD='{"action":"sync-pihole-dns"}'

          SIGNATURE="sha256=$(echo -n "$PAYLOAD" | \
            openssl dgst -sha256 -hmac "${{ secrets.N8N_WEBHOOK_SECRET }}" | \
            awk '{print $2}')"

          HTTP_STATUS=$(curl -s -o /tmp/n8n_response.json -w "%{http_code}" \
            -X POST "https://n8n.thalespm.me/webhook/homelab-ops" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: ${SIGNATURE}" \
            -d "$PAYLOAD")

          cat /tmp/n8n_response.json

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Webhook failed with status: $HTTP_STATUS"
            exit 1
          fi

          # 200 just means n8n accepted the request; a bad N8N_WEBHOOK_SECRET
          # still returns 200 with an error body and never runs the sync.
          if grep -q '"error"' /tmp/n8n_response.json; then
            echo "❌ n8n rejected the request (check N8N_WEBHOOK_SECRET)"
            exit 1
          fi

          echo "✅ Webhook accepted by n8n"
