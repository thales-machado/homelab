vrrp_script chk_pihole {
    script "/etc/keepalived/check-pihole.sh"
    interval 5
    timeout 3
    fall 3
    rise 2
}

vrrp_instance VI_DNS {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass __VRRP_PASS__
    }
    virtual_ipaddress {
        192.168.15.248/24
    }
    track_script {
        chk_pihole
    }
}
