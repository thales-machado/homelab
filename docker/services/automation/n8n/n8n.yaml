services:
  n8n:
    build: .
    image: n8n-custom:latest
    container_name: n8n
    restart: unless-stopped
    cpus: 2.00
    mem_limit: 2048m
    pids_limit: 128
    user: "1000:1000"
    group_add:
      - "1001"
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_EDITOR_BASE_URL=https://n8n.thalespm.me
      - N8N_HOST=n8n.thalespm.me
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      # Without this, n8n builds webhook URLs from PROTOCOL/HOST/PORT as
      # https://n8n.thalespm.me:5678/..., a port the tunnel doesn't serve -
      # broke the Healthchecks integration silently.
      - WEBHOOK_URL=https://n8n.thalespm.me/
      - N8N_PROXY_HOPS=1
      - N8N_SECURE_COOKIE=false
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,crypto,path
      - NODE_FUNCTION_ALLOW_EXTERNAL=ioredis
      - PAPERLESS_API_KEY=${PAPERLESS_API_KEY}
      - GENERIC_TIMEZONE=${TZ}
      - TZ=${TZ}
    volumes:
      - /opt/apps/n8n:/home/node/.n8n
    depends_on:
      dockflare-agent:
        condition: service_started
    networks:
      - cloudflare-net
    # Cross-host service (CONVENTIONS.md): bound to urahara's LAN IP so
    # Traefik on zangetsu can reach it via the file provider.
    ports:
      - "192.168.15.215:8097:5678"
    labels:
      # Custom-built image (build: ., never pushed to a registry): Watchtower
      # has nothing to check it against and only logs "Failed to retrieve
      # image info" every run. Update via `docker compose build` instead.
      com.centurylinklabs.watchtower.enable: "false"
      dockflare.enable: "true"
      dockflare.hostname: "n8n.thalespm.me"
      dockflare.service: "http://n8n:5678"
      dockflare.access.group: "homelab-admin"
      # Webhooks bypass Access (n8n validates them with its own token/path)
      dockflare.0.hostname: "n8n.thalespm.me"
      dockflare.0.path: "/webhook"
      dockflare.0.service: "http://n8n:5678"
      dockflare.0.access.group: "public-default-bypass"
      dockflare.1.hostname: "n8n.thalespm.me"
      dockflare.1.path: "/webhook-test"
      dockflare.1.service: "http://n8n:5678"
      dockflare.1.access.group: "public-default-bypass"
