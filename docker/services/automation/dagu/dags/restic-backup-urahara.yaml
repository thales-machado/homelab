name: restic-backup-urahara
description: |
  Daily Restic backup of /opt and /etc on urahara - the DAG runs on zangetsu and
  executes remotely over SSH (Dagu has no per-step remote DOCKER_HOST).

  Read bandwidth is capped at 100 MB/s. Uncapped, this job reads the NVMe at
  400 MB/s while writing to the NAS over CIFS, which stretches the read
  pressure over an hour. /var/lib/etcd lives on the same device: on 2026-11-17
  etcd's WAL fsync p99 went past 8 seconds during this backup, the API server
  failed its probes, and the kubelet spent the rest of the day killing and
  recreating the control plane. See PM-0010 in platform-engineering-labs.

schedule: "CRON_TZ=America/Sao_Paulo 45 2 * * *"

steps:
  - name: backup
    retry_policy:
      limit: 3
      interval_sec: 900
    action: ssh.run
    with:
      user: keydrop
      host: 192.168.15.215
      port: 22
      key: /opt/homelab-ssh/id_ed25519
      known_host_file: /opt/homelab-ssh/known_hosts
      strict_host_key: true
      # Explicit shell: ssh.run goes through a real remote shell (unlike
      # docker.run's direct API call), so without this Dagu's unescape pass
      # expands \$ and $(...) before the container exists.
      shell: /bin/sh
      command: >-
        docker run --rm
        --device-read-bps /dev/nvme0n1:100mb
        -v /opt/homelab/scripts:/opt/homelab/scripts:ro
        -v /opt/homelab/docker/hosts/urahara/.env:/opt/homelab/docker/hosts/urahara/.env:ro
        -v /opt:/source/opt:ro
        -v /etc:/source/etc:ro
        -v /mnt/backup/urahara:/repo
        --network cloudflare-net
        alpine:3
        sh -c "envf=/opt/homelab/docker/hosts/urahara/.env; export RESTIC_PASSWORD=\$(grep \"^RESTIC_PASSWORD=\" \$envf | cut -d= -f2-); apk add --no-cache --quiet restic && sh /opt/homelab/scripts/backup/backup-restic.sh urahara && wget -q -O /dev/null http://192.168.15.214:8000/ping/b12ec69a-b294-47fb-a137-03eb45ff6a12 || { wget -q -O /dev/null http://192.168.15.214:8000/ping/b12ec69a-b294-47fb-a137-03eb45ff6a12/fail; exit 1; }"
