name: postgres-backup
description: Consistent daily backup of the stack's Postgres databases (runs before the Restic backup)

schedule: "CRON_TZ=America/Sao_Paulo 35 2 * * *"

steps:
  - name: backup
    retry_policy:
      limit: 3
      interval_sec: 900
    action: docker.run
    with:
      # postgres:17, not 16, on purpose: pg_dump refuses to dump a server
      # NEWER than the client ("aborting because of server version
      # mismatch"), and komodo-postgres runs 17.6 under FerretDB. A newer
      # pg_dump always reads older servers, so 17 also covers the existing
      # 16 databases (paperless/firefly/immich/tandoor).
      image: postgres:17-alpine
      pull: missing
      auto_remove: true
      network:
        EndpointsConfig:
          cloudflare-net: {}
      volumes:
        - /opt/homelab/scripts:/opt/homelab/scripts:ro
        - /opt/homelab/docker/hosts/zangetsu/.env:/opt/homelab/docker/hosts/zangetsu/.env:ro
        - /opt/apps/paperless:/opt/apps/paperless
        - /opt/apps/firefly-iii:/opt/apps/firefly-iii
        - /opt/apps/immich:/opt/apps/immich
        - /opt/apps/tandoor:/opt/apps/tandoor
        - /opt/apps/komodo:/opt/apps/komodo
      command: sh -c "envf=/opt/homelab/docker/hosts/zangetsu/.env; export PAPERLESS_DBUSER=paperless; export PAPERLESS_DBPASS=$(grep '^PAPERLESS_DBPASS=' $envf | cut -d= -f2-); export PAPERLESS_DBNAME=paperless; export DB_USER=$(grep '^DB_USER=' $envf | cut -d= -f2-); export DB_PASSWORD=$(grep '^DB_PASSWORD=' $envf | cut -d= -f2-); export FIREFLY_DB_NAME=firefly; export IMMICH_DB_NAME=immich; export TANDOOR_DB_NAME=tandoor; sh /opt/homelab/scripts/backup/backup-postgres.sh && wget -q -O /dev/null http://healthchecks:8000/ping/8886abe5-09fe-4262-b4a4-679a66d9f42f || { wget -q -O /dev/null http://healthchecks:8000/ping/8886abe5-09fe-4262-b4a4-679a66d9f42f/fail; exit 1; }"
