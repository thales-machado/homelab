services:
  nebula-sync:
    image: ghcr.io/lovelaze/nebula-sync:latest
    container_name: nebula-sync
    restart: unless-stopped
    cpus: 0.20
    mem_limit: 128m
    pids_limit: 32
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      - "PRIMARY=http://pi-hole|${ADMIN_PASSWORD}"
      - "REPLICAS=http://192.168.15.215|${ADMIN_PASSWORD}"
      - CRON=0 */6 * * *
      - FULL_SYNC=true
      - RUN_GRAVITY=true
    # It syncs once on start, and a force deploy starts it alongside a Pi-hole
    # that is still booting: the sync then dies on connection refused and the
    # alert fires for something that fixes itself on the next run.
    depends_on:
      pi-hole:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - cloudflare-net
