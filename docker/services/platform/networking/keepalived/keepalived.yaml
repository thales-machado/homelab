services:
  keepalived:
    image: osixia/keepalived:2.3.4
    container_name: keepalived
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BROADCAST
    cpus: 0.10
    mem_limit: 32m
    # 16 caused a real "fork error" in production (VIP dropped on both hosts
    # at once) - pids counts threads, and s6-overlay + keepalived + VRRP
    # child overflowed it.
    pids_limit: 64
    volumes:
      - /opt/apps/keepalived/keepalived.conf:/etc/keepalived/keepalived.conf:ro
      # track script: releases the VIP when this host's Pi-hole stops answering.
      - /opt/apps/keepalived/check-pihole.sh:/etc/keepalived/check-pihole.sh:ro
    # Pinned tag (2.3.4): no Watchtower label, versions managed manually.
    # See "Docker image policy" in CONVENTIONS.md.
    environment:
      - TZ=${TZ}
