  # --- Platform - Kubernetes ---
  # Points at the seireitei Gateway (Cilium L2), not at Traefik.
  - domain: argocd.lan.thalespm.me
    ip: 192.168.15.241

  # --- Platform - Backup ---
  - domain: rclone.lan.thalespm.me
    ip: 192.168.15.214
  # Plain SMB, no Traefik: points straight at urahara, no certificate.
  - domain: samba.lan.thalespm.me
