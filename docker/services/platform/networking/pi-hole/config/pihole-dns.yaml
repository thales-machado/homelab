# =============================================================================
# Pi-hole — Local DNS Records
# =============================================================================
# Source of truth for the Pi-hole local DNS records.
# To apply: run scripts/networking/sync-pihole-dns.sh, or just commit (the
# GitHub Actions workflow runs it).
# =============================================================================

records:
  # --- Platform - Networking ---
  - domain: dockflare.lan.thalespm.me
    ip: 192.168.15.214
  - domain: pihole.lan.thalespm.me
    ip: 192.168.15.214
  - domain: traefik.lan.thalespm.me
    ip: 192.168.15.214

