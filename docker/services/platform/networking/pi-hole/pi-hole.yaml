services:
  pi-hole:
    image: pihole/pihole:latest
    container_name: pi-hole
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 512m
    pids_limit: 64
    cap_add:
      - CAP_SYS_TIME
      - CAP_NET_BIND_SERVICE
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    # The image's own healthcheck misses a deadlocked FTL (seen in production:
    # "healthy" while dig inside the container timed out). A real query for its
    # own hostname proves resolution end to end.
    healthcheck:
      test: ["CMD-SHELL", "dig +time=2 +tries=1 @127.0.0.1 pihole.lan.thalespm.me +short || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - /opt/apps/pihole/etc:/etc/pihole
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      # Upstreams via FTLCONF, never the legacy v5 PIHOLE_DNS_ (ignored in v6).
      # Real drift once: Google DNS got in from elsewhere and took queries.
      - FTLCONF_dns_upstreams=1.1.1.1;1.0.0.1
      - FTLCONF_dns_listeningMode=all
      # Dotless names (local hosts) are never forwarded upstream
      - FTLCONF_dns_domainNeeded=true
      # 30d of history is enough and reduces SD card writes (default: 91d)
      - FTLCONF_database_maxDBdays=30
      # Every container egresses with the host IP, so a registry scan bursts
      # past the 1000/60s default and Pi-hole then refuses DNS for the whole
      # host for ~7s.
      - FTLCONF_dns_rateLimit_count=4000
      - FTLCONF_dns_rateLimit_interval=60
      - FTLCONF_webserver_api_password=${ADMIN_PASSWORD}
      # Wildcards need a raw dnsmasq line; Local DNS records cannot do them.
      # Must be repeated in the replica override (see CONVENTIONS.md).
    networks:
      cloudflare-net:
        ipv4_address: ${PIHOLE_STATIC_IP:-172.22.0.240}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      # autoheal restarts the container when the healthcheck fails; Docker
      # does not do that natively.
      autoheal: "true"
      traefik.enable: "true"
      traefik.http.routers.pihole.rule: "Host(`pihole.lan.thalespm.me`)"
      traefik.http.routers.pihole.entrypoints: "websecure"
      traefik.http.routers.pihole.tls.certresolver: "cloudflare"
      # redirect / -> /admin/
      traefik.http.routers.pihole.middlewares: "pihole-redirect@file,crowdsec@file,security-headers@file"
      traefik.http.services.pihole.loadbalancer.server.port: "80"
