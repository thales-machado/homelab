services:
  cloudflared-agent:
    # Pinned and deliberately left without a Watchtower label: the whole
    # public network depends on this one container, and an auto-update once
    # took the tunnel down until someone intervened (CONVENTIONS.md, image
    # policy).
    image: cloudflare/cloudflared:2026.8.2
    container_name: cloudflared-agent-lemonpi-5-tunel
    restart: unless-stopped
    cpus: 0.30
    mem_limit: 128m
    pids_limit: 64
    user: "65532:65532"
    entrypoint:
      - cloudflared
      - --no-autoupdate
    command:
      - tunnel
      # Internal only, never published. /ready returns 200 only with a
      # registered connection, which is what the Uptime Kuma monitor checks -
      # a more direct signal than probing an app behind the tunnel.
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token
      - ${CF_TUNNEL_TOKEN}
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      # QUIC (UDP/7844) fails to reach some Cloudflare edges from this ISP;
      # this forces HTTP/2 over TCP instead.
      - TUNNEL_TRANSPORT_PROTOCOL=http2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cloudflare-net
