services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    cpus: 0.30
    mem_limit: 128m
    pids_limit: 64
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # Shared by both hosts (redundant subnet router); each resolves its own
      # name from NODE_HOSTNAME in its .env.
      - TS_HOSTNAME=${NODE_HOSTNAME}
      # --accept-dns=false is mandatory: with network_mode host there is no
      # namespace isolation, so accepting MagicDNS rewrites the host's real
      # /etc/resolv.conf and kills local DNS.
      - TS_EXTRA_ARGS=--advertise-routes=192.168.15.0/24 --accept-dns=false
      - TS_USERSPACE=false
      # zangetsu only (RPi kernel has no legacy ip_tables). Empty elsewhere,
      # which means auto-detect. See the Tailscale entry in CONVENTIONS.md.
      - TS_DEBUG_FIREWALL_MODE=${TAILSCALE_FIREWALL_MODE:-}
    volumes:
      - /opt/apps/tailscale/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      # Needed on the RPi or tailscaled configures no netfilter at all,
      # SNAT included (CONVENTIONS.md). Harmless on x86, so it stays shared.
      - /lib/modules:/lib/modules:ro
    healthcheck:
      # BackendState, not Online: a bare "Online" also matches a peer. Mind
      # the space after the colon in the JSON - a grep without it never hits.
      test: ["CMD-SHELL", "tailscale status --json | grep -q '\"BackendState\": \"Running\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
