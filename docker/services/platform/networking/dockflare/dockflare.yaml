services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    cpus: 0.30
    mem_limit: 128m
    pids_limit: 64
    environment:
      - TZ=${TZ}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - CONTAINERS=1
      - EVENTS=1
      - NETWORKS=1
      - IMAGES=1
      - POST=1
      - PING=1
      - INFO=1
      - EXEC=1
      - DISABLE_IPV6=1
      # Needed for Watchtower to remove old containers/images (WATCHTOWER_CLEANUP)
      - DELETE=1
      # Needed for autoheal to restart unhealthy containers
      - RESTART=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dockflare-internal
    # Pinned tag (v0.5.0): no Watchtower label, versions managed manually.

  dockflare-init:
    image: alpine:3.24
    container_name: dockflare-init
    cpus: 0.10
    mem_limit: 64m
    pids_limit: 64
    environment:
      - TZ=${TZ}
    command: ["sh", "-c", "chown -R 65532:65532 /app/data"]
    volumes:
      - /opt/apps/dockflare:/app/data
    networks:
      - cloudflare-net
    restart: "no"
    # Does NOT run on a plain `docker compose up -d` - chowns
    # /opt/apps/dockflare to UID 65532, run by hand first. Details in
    # docs/traefik-dockflare.md.
    profiles:
      - init
    labels:
      komodo.skip: ""

  dockflare:
    image: alplat/dockflare:stable
    container_name: dockflare
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/ping')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - /opt/apps/dockflare:/app/data
    # Documented exception to "publish no port": the remote Agent reaches the
    # master by IP, without depending on the proxy or its certificate.
    ports:
      - "192.168.15.214:5000:5000"
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_DB_INDEX=0
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - CF_API_TOKEN=${CF_API_TOKEN}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - CF_ZONE_ID=${CF_ZONE_ID}
      - TUNNEL_NAME=lemonpi-5-tunel
      - LABEL_PREFIX=dockflare
      - GRACE_PERIOD_SECONDS=28800
      - CLEANUP_INTERVAL_SECONDS=300
      - AGENT_STATUS_UPDATE_INTERVAL_SECONDS=10
      - SCAN_ALL_NETWORKS=false
      - CLOUDFLARED_NETWORK_NAME=cloudflare-net
      # External mode: DockFlare only reads labels, never touches the
      # cloudflared container - managed mode recreating it outside compose
      # caused "container name already in use" (docs/traefik-dockflare.md).
      - USE_EXTERNAL_CLOUDFLARED=true
      - EXTERNAL_TUNNEL_ID=${CF_TUNNEL_ID}
      - MAX_CONCURRENT_DNS_OPS=3
      - GITHUB_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET}
    depends_on:
      cloudflared-agent:
        condition: service_started
      docker-socket-proxy:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - cloudflare-net
      - dockflare-internal
    labels:
      dockflare.enable: "false"
      # "stable", not "latest": no digits, safe for digest watching.
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.dockflare.rule: "Host(`dockflare.lan.thalespm.me`)"
      traefik.http.routers.dockflare.entrypoints: "websecure"
      traefik.http.routers.dockflare.tls.certresolver: "cloudflare"
      traefik.http.routers.dockflare.middlewares: "crowdsec@file,security-headers@file"
      traefik.http.services.dockflare.loadbalancer.server.port: "5000"

  redis:
    image: redis:8-alpine
    container_name: dockflare-redis
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    cpus: 0.30
    mem_limit: 192m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - /opt/apps/dockflare:/data
    networks:
      - cloudflare-net
    # "8-alpine" tag: no Watchtower label, never auto-updated (on purpose:
    # risk of wrong semver coercion in update tools).
