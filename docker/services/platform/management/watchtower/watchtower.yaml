services:
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    cpus: 0.20
    mem_limit: 128m
    pids_limit: 32
    ports:
      - "${WATCHTOWER_PORT:-8080}:8080"
    volumes:
      # ghcr.io auth (docker login as keydrop): REPO_USER/REPO_PASS below
      # only cover Docker Hub. Watchtower reads this file the same way the
      # Docker CLI does, on top of those.
      - /home/keydrop/.docker/config.json:/config.json:ro
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - REPO_USER=${ADMIN_EMAIL}
      - REPO_PASS=${DOCKERHUB_PAT}
      - WATCHTOWER_CLEANUP=true
      # 03:30 BRT default, between backups and n8n's early jobs. Overridable
      # per host - see WATCHTOWER_SCHEDULE in CONVENTIONS.md.
      - "WATCHTOWER_SCHEDULE=${WATCHTOWER_SCHEDULE:-0 30 3 * * *}"
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL}
      - WATCHTOWER_NOTIFICATION_REPORT=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN}
      - WATCHTOWER_HTTP_API_METRICS=true
    depends_on:
      docker-socket-proxy:
        condition: service_started
    networks:
      - cloudflare-net
      - dockflare-internal
    labels:
      # Self-update is already refused ("Published port detected") because
      # of the ports: mapping above, so there's nothing to gain from
      # scanning itself every run - just noise in the report.
      com.centurylinklabs.watchtower.enable: "false"
