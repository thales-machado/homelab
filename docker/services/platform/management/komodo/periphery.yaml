# Komodo Periphery: one agent per managed host, included on both zangetsu and
# urahara. PERIPHERY_CORE_ADDRESS/PERIPHERY_CONNECT_AS differ per host, so they
# come from each host's .env. See docs/komodo.md for why the passkey,
# SERVER_ENABLED and HOMELAB_ENV below are all mandatory (each one fails
# silently when missing).
services:
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2
    container_name: komodo-periphery
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 512m
    # Scales with the host: at 128 it sat at 127 on a 37-container host and
    # every new thread failed silently - see docs/komodo.md.
    pids_limit: 1024
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      - PERIPHERY_CORE_ADDRESS=${KOMODO_PERIPHERY_CORE_ADDRESS}
      - PERIPHERY_CONNECT_AS=${KOMODO_SERVER_NAME}
      - PERIPHERY_CORE_PUBLIC_KEYS=file:/config/keys/core.pub
      - PERIPHERY_PASSKEYS=${KOMODO_PASSKEY}
      - PERIPHERY_SERVER_ENABLED=true
      - PERIPHERY_ROOT_DIRECTORY=/opt/apps/komodo/periphery/root
      # Resolved by the shell that starts this container; the compose
      # subprocess inside Periphery has no /etc/environment.
      - HOMELAB_ENV=${HOMELAB_ENV}
      # git safe.directory via env vars: /opt/homelab belongs to keydrop,
      # Periphery runs as root. A host override that redeclares environment:
      # must repeat all three lines (GIT_CONFIG_* does not merge).
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/opt/homelab
    volumes:
      - /opt/apps/komodo/periphery/keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /opt/apps/komodo/periphery/root:/opt/apps/komodo/periphery/root
      # The Stack reads compose.yaml/.env straight from the real repo path.
      - /opt/homelab:/opt/homelab
    labels:
      # Without auto-update Periphery drifts from Core's version
      # ("Server Version Mismatch", seen twice). Safe here: separate Compose
      # project, so a Watchtower recreate cannot collide with a deploy.
      com.centurylinklabs.watchtower.enable: "true"
      dockflare.enable: "false"
    networks:
      - cloudflare-net
