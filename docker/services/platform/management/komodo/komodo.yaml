# Komodo Core, zangetsu only. Backend is Postgres+FerretDB (Mongo wire
# protocol over Postgres) rather than MongoDB, so the existing
# postgres-exporter and backup-postgres.sh cover it. Agents: periphery.yaml.
# Deploy is manual, never through Komodo itself - see docs/komodo.md.
services:
  komodo-postgres:
    # 🚨 Explicit version pin: updates can break the DocumentDB extension.
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    container_name: komodo-postgres
    restart: unless-stopped
    cpus: 0.30
    # 512m, not 256m: steady state already sits at ~197MiB (77% of 256m) and the
    # write burst of a Stack deploy pushed it over twice on 2026-11-10 (OOM killed).
    mem_limit: 512m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - /opt/apps/komodo/postgres-data:/var/lib/postgresql/data
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=postgres
    labels:
      # Keeps Komodo from stopping/managing its own database (StopAllContainers)
      komodo.skip: ""
    networks:
      - cloudflare-net

  komodo-ferretdb:
    # 🚨 Explicit version pin: updates can break compatibility with Core.
    image: ghcr.io/ferretdb/ferretdb:2.7.0
    container_name: komodo-ferretdb
    restart: unless-stopped
    cpus: 0.30
    mem_limit: 256m
    pids_limit: 64
    depends_on:
      komodo-postgres:
        condition: service_healthy
    volumes:
      - /opt/apps/komodo/ferretdb-state:/state
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      - FERRETDB_POSTGRESQL_URL=postgres://${DB_USER}:${DB_PASSWORD}@komodo-postgres:5432/postgres
    labels:
      komodo.skip: ""
    networks:
      - cloudflare-net

  komodo-core:
    image: ghcr.io/moghtech/komodo-core:2
    container_name: komodo-core
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 512m
    # Also found at 127/128 on 2026-11-23, for the same reason as Periphery.
    pids_limit: 512
    depends_on:
      - komodo-ferretdb
    # No depends_on: dockflare - cross-project depends_on does not work, and
    # this is a separate Compose project (docs/komodo.md).
    # Published on the LAN so the Periphery on urahara can reach Core.
    ports:
      - "192.168.15.214:9120:9120"
    # Both Stacks use webhook_force_deploy: true because DeployStackIfChanged
    # hangs on include:-heavy stacks. Do not revert without a reproducible
    # test - full story in docs/komodo.md.
    volumes:
      - /opt/apps/komodo/keys:/config/keys
      - /opt/apps/komodo/backups:/backups
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      - KOMODO_DATABASE_ADDRESS=komodo-ferretdb:27017
      - KOMODO_DATABASE_USERNAME=${DB_USER}
      - KOMODO_DATABASE_PASSWORD=${DB_PASSWORD}
      - KOMODO_HOST=https://komodo.lan.thalespm.me
      - KOMODO_LOCAL_AUTH=true
      - KOMODO_INIT_ADMIN_USERNAME=${ADMIN_USER}
      - KOMODO_INIT_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - KOMODO_JWT_SECRET=${KOMODO_JWT_SECRET}
      - KOMODO_WEBHOOK_SECRET=${KOMODO_WEBHOOK_SECRET}
      - KOMODO_PASSKEY=${KOMODO_PASSKEY}
      # Default is 1h, too slow for the dashboard to notice a new or removed
      # container. CPU/mem stats are already fast by default.
      - KOMODO_RESOURCE_POLL_INTERVAL=5-min
    labels:
      # After each auto-update, check the changelog: the force-deploy
      # workaround above may no longer be needed.
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.komodo.rule: "Host(`komodo.lan.thalespm.me`)"
      traefik.http.routers.komodo.entrypoints: "websecure"
      traefik.http.routers.komodo.tls.certresolver: "cloudflare"
      traefik.http.routers.komodo.middlewares: "crowdsec@file,security-headers@file"
      traefik.http.services.komodo.loadbalancer.server.port: "9120"
      # Public because GitHub cannot reach *.lan.thalespm.me (split-horizon).
      dockflare.enable: "true"
      dockflare.hostname: "komodo.thalespm.me"
      dockflare.service: "http://komodo-core:9120"
      dockflare.access.group: "homelab-admin"
      # The listener bypasses Access (GitHub cannot do MFA); Komodo validates
      # the HMAC signature itself.
      dockflare.0.hostname: "komodo.thalespm.me"
      dockflare.0.path: "/listener"
      dockflare.0.service: "http://komodo-core:9120"
      dockflare.0.access.group: "public-default-bypass"
    networks:
      - cloudflare-net
