apiVersion: 1

groups:
    - orgId: 1
      name: homelab
      folder: Homelab Alerts
      interval: 1m
      rules:
        - uid: disk-full
          title: Disk almost full
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint='/'} / node_filesystem_size_bytes{mountpoint='/'})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 85
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            summary: '{{ $values.A.Value }}% used on root disk (threshold 85%)'
          labels:
            severity: warning
            shortname: DISK
          isPaused: false
        - uid: cpu-temp
          title: High CPU temperature
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: node_thermal_zone_temp{zone='0'}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 75
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            summary: '{{ $values.A.Value }}°C (threshold 75°C)'
          labels:
            severity: warning
            shortname: CPU
          isPaused: false
        - uid: ram-high
          title: High RAM usage
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 90
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            summary: '{{ $values.A.Value }}% used (threshold 90%)'
          labels:
            severity: warning
            shortname: RAM
          isPaused: false
        - uid: target-down
          title: Monitoring target down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: up
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            summary: '[{{ $labels.job }}] - {{ if (lt $values.A.Value 1.0) }}{{ $labels.instance }} not responding{{ else }}{{ $labels.instance }} responding again{{ end }}'
          labels:
            severity: warning
            shortname: SERVICE
          isPaused: false
        - uid: mount-immich-active
          title: Immich mount (NAS) down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: node_filesystem_device_error{mountpoint='/mnt/media/immich'}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 5m
          annotations:
            summary: '[immich] - NAS CIFS mount (/mnt/media/immich) unreachable or with device error'
          labels:
            severity: warning
            shortname: MOUNT
          isPaused: false
        - uid: mount-immich-space
          title: Immich mount (NAS) space high
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint='/mnt/media/immich'} / node_filesystem_size_bytes{mountpoint='/mnt/media/immich'})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 85
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            summary: '[immich] - {{ $values.A.Value }}% used (threshold 85%)'
          labels:
            severity: warning
            shortname: MOUNT
          isPaused: false
        - uid: mount-remote-active
          title: Google Drive mount (rclone) down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: node_filesystem_device_error{mountpoint='/mnt/remote'}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 5m
          annotations:
            summary: '[gdrive] - rclone mount (/mnt/remote) unreachable or with device error (quota makes the space check unreliable)'
          labels:
            severity: warning
            shortname: MOUNT
          isPaused: false
        - uid: mount-paperless-active
          title: Paperless mount (NAS) down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: node_filesystem_device_error{mountpoint='/mnt/media/paperless'}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 5m
          annotations:
            summary: '[paperless] - NAS CIFS mount (/mnt/media/paperless) unreachable or with device error'
          labels:
            severity: warning
            shortname: MOUNT
          isPaused: false
        - uid: mount-paperless-space
          title: Paperless mount (NAS) space high
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint='/mnt/media/paperless'} / node_filesystem_size_bytes{mountpoint='/mnt/media/paperless'})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 85
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            summary: '[paperless] - {{ $values.A.Value }}% used (threshold 85%)'
          labels:
            severity: warning
            shortname: MOUNT
          isPaused: false
        - uid: mount-backup-active
          title: Backup mount (Restic) down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: node_filesystem_device_error{mountpoint=~'/mnt/backup/.*'}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 5m
          annotations:
            summary: '[backup-restic] - NAS CIFS mount (/mnt/backup) unreachable or with device error'
          labels:
            severity: warning
            shortname: MOUNT
          isPaused: false
        - uid: mount-backup-space
          title: Backup mount (Restic) space high
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint=~'/mnt/backup/.*'} / node_filesystem_size_bytes{mountpoint=~'/mnt/backup/.*'})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 85
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            summary: '[backup-restic] - {{ $values.A.Value }}% used (threshold 85%)'
          labels:
            severity: warning
            shortname: MOUNT
          isPaused: false
        - uid: mount-retro-active
          title: games-4tb disk (retro/Wolf) down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: node_filesystem_device_error{mountpoint='/mnt/games-4tb'}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 5m
          annotations:
            summary: '[games-4tb] - local disk mount (/mnt/games-4tb) unreachable or with device error'
          labels:
            severity: warning
            shortname: MOUNT
          isPaused: false
        - uid: container-restart
          title: Container restarted
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                # container_start_time_seconds is the creation time (does not
                # change on in-place restarts). An in-place restart resets the
                # CPU counter in the same series; a recreate is a new series.
                expr: resets(container_cpu_usage_seconds_total{name!="",cpu="total"}[5m])
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 0s
          annotations:
            summary: '[{{ $labels.host }}] - container *{{ $labels.name }}* restarted {{ $values.A.Value }}x in the last 5min'
          labels:
            severity: warning
            shortname: RESTART
          isPaused: false
        - uid: nebula-sync-failed
          title: Nebula Sync has not completed (Pi-hole replica)
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 46800
                to: 0
              datasourceUid: efswmxbcxua68c
              model:
                queryType: instant
                # Absence of success, not presence of failure: a lone "Sync
                # failed" is usually Pi-hole still booting. 13h covers two
                # cron cycles and also catches the container never running.
                expr: 'sum(count_over_time({container="nebula-sync"} |= "Sync completed" [13h]))'
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 10m
          annotations:
            summary: '[nebula-sync] - no successful sync with the replica (urahara) in 13h, against a 6h schedule - check the container logs'
          labels:
            severity: warning
            shortname: PIHOLE
            host: zangetsu
          isPaused: false
        - uid: container-oom
          title: Container OOM killed
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: increase(container_oom_events_total{name!=""}[5m])
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 0s
          annotations:
            summary: '[{{ $labels.host }}] - container *{{ $labels.name }}* was OOM killed {{ printf "%.0f" $values.A.Value }} time(s) in the last 5min'
          labels:
            severity: warning
            shortname: OOM
          isPaused: false
        - uid: traefik-backend-down
          title: Traefik cannot connect to a backend
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: efswmxbcxua68c
              model:
                queryType: instant
                expr: 'sum by (backend) (count_over_time({container="traefik"} |~ "connect: connection refused" | json | label_format backend=routerName [5m]))'
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 3
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 1m
          annotations:
            summary: '[{{ $labels.backend }}] - {{ $values.A.Value }} failures in the last 5m'
          labels:
            severity: warning
            shortname: TRAEFIK
            host: zangetsu
          isPaused: false
        - uid: unifi-ap-down
          title: AP UniFi offline
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                # Staleness signal per AP via last_over_time+timestamp(), not
                # count(uptime_seconds): a vanished series there got stuck
                # before "resolved" since it had no new value to re-evaluate.
                expr: time() - timestamp(last_over_time(unpoller_device_uptime_seconds{type="uap"}[24h]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 300
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 1m
          annotations:
            summary: '{{ $labels.name }} - {{ if (gt $values.A.Value 300.0) }}offline{{ else }}back online{{ end }}'
          labels:
            severity: warning
            shortname: UNIFI
            host: AP
          isPaused: false
        - uid: unifi-wan-down
          title: UniFi uplink/WAN degraded
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: unpoller_wan_uptime_percentage
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 99
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            summary: '[{{ $labels.wan_name }}] - uptime {{ $values.A.Value }}% (expected ≥99%)'
          labels:
            severity: warning
            shortname: UNIFI
            host: WAN
          isPaused: false
        - uid: healthchecks-check-down
          title: Healthchecks check is down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: hc_check_up{name!="wolf-image-check"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 15m
          annotations:
            summary: 'The Healthchecks check *{{ $labels.name }}* is down: the job behind it did not report in on schedule. wolf-image-check is excluded on purpose, because its failure means a new image digest on GHCR, not a broken job.'
          labels:
            severity: critical
            shortname: HEALTHCHECKS
          isPaused: false
        - uid: healthchecks-metrics-stale
          title: Healthchecks metrics are stale
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: time() - hc_scrape_timestamp_seconds
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1800
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 10m
          annotations:
            summary: 'The Healthchecks textfile metrics are more than 30 minutes old, against a timer that runs every 5. A textfile metric serves its last value forever, so without this rule every check above would keep reporting healthy while nothing was being read at all.'
          labels:
            severity: warning
            shortname: HEALTHCHECKS
          isPaused: false

        - uid: seireitei-etcd-slow-fsync
          title: etcd WAL fsync is slow (seireitei)
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: histogram_quantile(0.99, sum(rate(etcd_disk_wal_fsync_duration_seconds_bucket{cluster="seireitei"}[5m])) by (le))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.1
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 5m
          annotations:
            summary: 'etcd p99 WAL fsync above 100ms for 5 minutes on seireitei. PM-0010: a Restic backup reading /opt at 400 MB/s pushed this to 8192ms and put the control plane into a 15-hour restart loop. Four hours of this metric preceded the first visible symptom and nothing was watching it. Check what is reading the NVMe before touching the cluster. noData is Alerting on purpose: the scrape comes from outside the cluster, so silence means etcd stopped answering.'
          labels:
            severity: critical
            shortname: SEIREITEI
            host: urahara
          isPaused: false

        - uid: cfgate-dns-not-ready
          title: cfgate cannot manage a DNS record (seireitei)
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffssrfrz5yxogd
              model:
                expr: min(cfgate_dns_condition{type="Ready"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 10m
          annotations:
            summary: 'cfgate lost control of a DNS record at the cluster edge and will not recover on its own. Traffic keeps working, so nothing else shows it. Which hostname: kubectl -n cfgate-edge get cloudflaredns seireitei -o json, read status.records[]. Usual cause in CONVENTIONS.md.'
          labels:
            severity: critical
            shortname: CFGATE
            host: urahara
          isPaused: false

# Orphan rules removed via file (deleteRules): Grafana won't delete a
# file-provisioned rule just because it left groups: above (known bug,
# X-Disable-Provenance doesn't help) - must be declared here explicitly.
deleteRules:
    # The 15 lab rules, removed with the lab cluster on 2026-11-19. Grafana does
    # not delete a file-provisioned rule just because it left groups: above.
    - orgId: 1
      uid: k8s-lab-apiserver-down
    - orgId: 1
      uid: k8s-lab-app-down
    - orgId: 1
      uid: k8s-lab-control-plane-restart
    - orgId: 1
      uid: k8s-lab-etcd-slow-fsync
    - orgId: 1
      uid: k8s-lab-node-not-ready
    - orgId: 1
      uid: k8s-lab-crashloop
    - orgId: 1
      uid: k8s-lab-calico-node-restart
    - orgId: 1
      uid: k8s-lab-no-lb-announcement
    - orgId: 1
      uid: k8s-lab-cross-node-network
    - orgId: 1
      uid: k8s-lab-binary-mismatch
    - orgId: 1
      uid: k8s-lab-integrity-check-stale
    - orgId: 1
      uid: k8s-lab-cert-expiring
    - orgId: 1
      uid: k8s-lab-pod-restarting
    - orgId: 1
      uid: k8s-lab-slo-fast-burn
    - orgId: 1
      uid: k8s-lab-slo-slow-burn
    - orgId: 1
      uid: caddy-backend-down
    # Covered by the Uptime Kuma TCP monitor on 47989
    - orgId: 1
      uid: wolf-down
