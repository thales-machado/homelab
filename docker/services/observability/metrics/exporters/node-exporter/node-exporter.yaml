services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    # No network_mode: host, so node_uname_info would report the container's
    # hostname, not the real one - NODE_HOSTNAME overrides it per host's .env.
    hostname: ${NODE_HOSTNAME}
    restart: unless-stopped
    cpus: 0.20
    mem_limit: 128m
    pids_limit: 32
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # Metrics written by scripts on the host, read on the next scrape.
      # Today: healthchecks-textfile.sh, which must report even when the
      # thing it watches is down.
      - /var/lib/node-exporter/textfile:/textfile:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)
      # Extra collectors used by the Node Exporter Full dashboard
      - --collector.processes
      - --collector.tcpstat
      - --collector.textfile.directory=/textfile
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
    networks:
      - cloudflare-net
    labels:
      com.centurylinklabs.watchtower.enable: "true"
