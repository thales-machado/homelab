services:
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    cpus: 0.20
    mem_limit: 64m
    pids_limit: 32
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
    # No DATA_SOURCE_NAME: multi-target mode via /probe instead (prometheus.yml
    # job "postgres-exporter") - comma-separated DSNs only exposed the first
    # database's collectors, with no "server" label to tell them apart.
    command:
      - --config.file=/etc/postgres_exporter.yml
    volumes:
      - /opt/apps/postgres-exporter/postgres_exporter.yml:/etc/postgres_exporter.yml:ro
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - cloudflare-net
