services:
  redis-exporter-urahara:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter-urahara
    restart: unless-stopped
    cpus: 0.20
    mem_limit: 64m
    pids_limit: 32
    # No fixed REDIS_ADDR: multi-target via /scrape?target=... monitors both
    # immich-redis and paperless-redis, same pattern as blackbox-exporter.
    # Cross-host (CONVENTIONS.md): VictoriaMetrics on zangetsu needs IP:port.
    ports:
      - "192.168.15.215:9121:9121"
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - cloudflare-net
