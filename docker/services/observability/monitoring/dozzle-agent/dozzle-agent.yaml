services:
  dozzle-agent:
    image: amir20/dozzle:latest
    container_name: dozzle-agent
    restart: unless-stopped
    cpus: 0.20
    mem_limit: 64m
    pids_limit: 32
    command: agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
    # Cross-host (CONVENTIONS.md): Dozzle master on zangetsu connects by
    # IP:port. Agent mode replaces docker-socket-proxy here - Dozzle's docs
    # say agent and proxy don't combine.
    ports:
      - "192.168.15.215:7007:7007"
    networks:
      - cloudflare-net
    labels:
      com.centurylinklabs.watchtower.enable: "true"
