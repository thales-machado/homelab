services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    # 1.00 and 512m, measured on 2026-11-19 with 82 monitors on the RPi 5:
    # memory.events counted 97110 hits against the 256 MiB ceiling, with
    # memory.current parked at 98.9% of it. Never OOM-killed, because the
    # kernel reclaims instead, and that reclaim storm is what made the
    # monitor-list socket event never complete, the UI render an empty
    # dashboard and a single DELETE take 2.2s. cpu.stat showed 231 throttled
    # periods out of 3445, part of it spent reclaiming.
    cpus: 1.00
    mem_limit: 512m
    pids_limit: 64
    volumes:
      - /opt/apps/uptime-kuma:/app/data
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
    depends_on:
      dockflare:
        condition: service_started
    # dockflare-internal: Docker Container monitors query the local
    # docker-socket-proxy, which only lives on that network.
    networks:
      - cloudflare-net
      - dockflare-internal
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.uptime-kuma.rule: "Host(`uptime-kuma.lan.thalespm.me`)"
      traefik.http.routers.uptime-kuma.entrypoints: "websecure"
      traefik.http.routers.uptime-kuma.tls.certresolver: "cloudflare"
      traefik.http.routers.uptime-kuma.middlewares: "crowdsec@file,security-headers@file"
      traefik.http.services.uptime-kuma.loadbalancer.server.port: "3001"
