services:
  thalesmachado-net:
    # Separate repo (Astro, github.com/thales-machado/thalesmachado.net),
    # built+pushed to GHCR by its own CI. Private package, but zangetsu
    # already has GHCR credentials (set up for whatsapp-gw/wa-courier).
    image: ghcr.io/thales-machado/thalesmachado.net:latest
    container_name: thalesmachado-net
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 32
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
    networks:
      - cloudflare-net
    depends_on:
      dockflare:
        condition: service_healthy
      thalesmachado-net-containers:
        condition: service_started
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      # Two zones, same tunnel: dockflare.zonename overrides CF_ZONE_ID only
      # for rule .0 (thalesmachado.net). No access.group on purpose -
      # personal portfolio, must work without MFA (CONVENTIONS.md exception).
      dockflare.enable: "true"
      dockflare.hostname: "thalespm.me"
      dockflare.service: "http://thalesmachado-net:8080"
      dockflare.0.hostname: "thalesmachado.net"
      dockflare.0.zonename: "thalesmachado.net"
      dockflare.0.service: "http://thalesmachado-net:8080"

  thalesmachado-net-containers:
    # Sums container counts from both hosts via Komodo's API - plain nginx
    # can't reshape/sum two JSON calls. KOMODO_URL defaults to komodo-core:9120
    # (right here); the cluster overrides it since that name is network-local.
    image: ghcr.io/thales-machado/thalesmachado.net-containers:latest
    container_name: thalesmachado-net-containers
    restart: unless-stopped
    cpus: 0.10
    mem_limit: 32m
    pids_limit: 16
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      # The same Komodo pair Homepage uses, on purpose, instead of a new
      # dedicated credential.
      - KOMODO_API_KEY=${KOMODO_API_KEY}
      - KOMODO_API_SECRET=${KOMODO_API_SECRET}
    networks:
      - cloudflare-net
    labels:
      com.centurylinklabs.watchtower.enable: "true"
