---
# =============================================================================
# ABA: INFRA
# =============================================================================

- Platform:
    - Komodo:
        icon: komodo.png
        href: https://komodo.lan.thalespm.me
        description: Docker Management
        server: zangetsu
        container: komodo-core
        widget:
          type: komodo
          url: http://komodo-core:9120
          key: "{{HOMEPAGE_VAR_KOMODO_KEY}}"
          secret: "{{HOMEPAGE_VAR_KOMODO_SECRET}}"
          showSummary: true

    - DockFlare:
        icon: cloudflare-zero-trust.png
        href: https://dockflare.lan.thalespm.me
        description: Tunnel Manager
        server: zangetsu
        container: dockflare

    - Traefik:
        icon: traefik.png
        href: https://traefik.lan.thalespm.me
        description: Reverse Proxy
        server: zangetsu
        container: traefik
        widget:
          type: traefik
          url: http://traefik:8080

    - Pi-hole:
        icon: pi-hole.png
        href: https://pihole.lan.thalespm.me
        description: DNS & Ad Blocking
        server: zangetsu
        container: pi-hole
        widget:
          type: pihole
          url: http://pi-hole
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"

    - Vaultwarden:
        icon: bitwarden.png
        href: https://vaultwarden.thalespm.me
        description: Password Manager
        server: zangetsu
        container: vaultwarden

    - Healthchecks:
        icon: healthchecks.png
        href: https://healthchecks.lan.thalespm.me
        description: Job & Cron Monitoring
        server: zangetsu
        container: healthchecks
        widget:
          type: healthchecks
          url: http://healthchecks:8000
          key: "{{HOMEPAGE_VAR_HEALTHCHECKS_KEY}}"

- Observability:
    - Grafana:
        icon: grafana.png
        href: https://grafana.lan.thalespm.me/dashboards
        description: Metrics & Dashboards
        server: zangetsu
        container: grafana
        widget:
          type: grafana
          url: http://grafana:3000
          username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
          password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
          fields: ["dashboards", "datasources", "totalalerts", "alertstriggered"]

    - Dozzle:
        icon: dozzle.png
        href: https://dozzle.lan.thalespm.me
        description: Container Logs
        server: zangetsu
        container: dozzle

    - Uptime Kuma:
        icon: uptime-kuma.png
        href: https://uptime-kuma.lan.thalespm.me
        description: Uptime Monitoring
        server: zangetsu
        container: uptime-kuma
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          slug: homelab

    - Scrutiny:
        icon: scrutiny.png
        href: https://scrutiny.lan.thalespm.me
        description: Disk Health (S.M.A.R.T)
        server: zangetsu
        container: scrutiny
        widget:
          type: scrutiny
          url: http://scrutiny:8080

    - UniFi:
        icon: unifi.png
        href: https://unifi.lan.thalespm.me
        description: Network Controller
        widget:
          type: unifi
          url: https://unifi.lan.thalespm.me
          username: "{{HOMEPAGE_VAR_UNIFI_USER}}"
          password: "{{HOMEPAGE_VAR_UNIFI_PASSWORD}}"

    - QNAP:
        icon: qnap.png
        href: https://nas.lan.thalespm.me
        description: NAS Storage
        widget:
          type: qnap
          # The NAS IP, not nas.lan.thalespm.me: Traefik only proxies 443 and the widget needs the real 8443
          url: https://192.168.15.200:8443
          username: "{{HOMEPAGE_VAR_QNAP_USER}}"
          password: "{{HOMEPAGE_VAR_QNAP_PASSWORD}}"

    - Watchtower (zangetsu):
        icon: watchtower.png
        description: Auto Updater
        server: zangetsu
        container: watchtower
        widget:
          type: watchtower
          url: http://watchtower:8080
          key: "{{HOMEPAGE_VAR_WATCHTOWER_ZANGETSU_TOKEN}}"

    - Watchtower (urahara):
        icon: watchtower.png
        description: Auto Updater
        server: urahara
        container: watchtower
        widget:
          type: watchtower
          # Porta publicada do watchtower no urahara (WATCHTOWER_PORT no .env
          # dele) - 8084, unica porta livre confirmada (8080=stirling-pdf,
          # 8081=cadvisor, 8082/8083 tambem ocupadas).
          url: http://192.168.15.215:8084
          key: "{{HOMEPAGE_VAR_WATCHTOWER_URAHARA_TOKEN}}"

- Automation:
    - Dagu:
        icon: sh-dagu-dark.png
        href: https://dagu.lan.thalespm.me
        description: DAG Workflow Scheduler
        server: zangetsu
        container: dagu

    - N8N:
        icon: n8n.png
        href: https://n8n.thalespm.me
        description: Workflow Automation
        server: urahara
        container: n8n

    - Evolution API:
        icon: /icons/evolution-api.png
        href: https://evo-api.lan.thalespm.me/manager
        description: WhatsApp Gateway API
        server: urahara
        container: evolution-api

- AI:
    - Headroom:
        icon: /icons/headroom.png
        href: https://headroom.lan.thalespm.me
        description: LLM Context Optimizer
        widget:
          type: customapi
          url: http://192.168.15.220:8787/stats
          refreshInterval: 30000
          mappings:
            - field: tokens_saved
              label: Tokens Saved
              format: number
            - field: cost_saved_usd
              label: Cost Saved
              format: text
              prefix: "$"
            - field: requests_total
              label: Requests
              format: number

# =============================================================================
# ABA: APPS
# =============================================================================

- Finance:
    - Firefly III:
        icon: firefly.png
        href: https://firefly.lan.thalespm.me
        description: Personal Finance Manager
        server: zangetsu
        container: firefly-iii
        widget:
          type: firefly
          url: http://firefly-iii:8080
          key: "{{HOMEPAGE_VAR_FIREFLY_TOKEN}}"

- Content:
    - Paperless-ngx:
        icon: paperless.png
        href: https://paperless.lan.thalespm.me
        description: Document Management
        server: urahara
        container: paperless-ngx
        widget:
          type: paperlessngx
          url: http://192.168.15.215:8000
          username: "{{HOMEPAGE_VAR_PAPERLESS_USER}}"
          password: "{{HOMEPAGE_VAR_PAPERLESS_PASSWORD}}"

    - Stirling PDF:
        icon: stirling-pdf.png
        href: https://stirling.lan.thalespm.me
        description: PDF Toolkit
        server: urahara
        container: stirling-pdf

    - Immich:
        icon: immich.png
        href: https://immich.lan.thalespm.me
        description: Photo Management
        server: urahara
        container: immich-server
        widget:
          type: immich
          url: http://192.168.15.215:2283
          key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
          version: 2

    - TandoorRecipes:
        # "tandoor" is not in Homepage's default icon pack (dashboard-icons),
        # so this points at the project's own logo.
        icon: https://raw.githubusercontent.com/vabene1111/recipes/develop/docs/logo_color.svg
        href: https://tandoor.lan.thalespm.me
        description: Recipe Manager
        server: urahara
        container: tandoor
        # No key yet: generate an API key (Settings -> API -> Generate,
        # read scope) after the first-run setup.
        widget:
          type: tandoor
          url: http://192.168.15.215:8083
          key: "{{HOMEPAGE_VAR_TANDOOR_KEY}}"

- Smart Home:
    - Home Assistant:
        icon: home-assistant.png
        href: https://homeassistant.lan.thalespm.me
        description: Home Automation
        server: urahara
        container: home-assistant
        # No key yet: generate a Long-Lived Access Token in the user profile
        # after onboarding.
        widget:
          type: homeassistant
          url: http://192.168.15.215:8123
          key: "{{HOMEPAGE_VAR_HOMEASSISTANT_KEY}}"

- Utilities:
    - Calnode:
        icon: calendar.png
        href: https://calnode.thalespm.me
        description: Booking Page
        server: urahara
        container: calnode

    - IT-Tools:
        icon: it-tools.png
        href: https://it-tools.thalespm.me
        description: Developer Tools
        server: urahara
        container: it-tools

    - TriliumNext:
        icon: trilium.png
        href: https://trilium.lan.thalespm.me
        description: Notes & Knowledge Base
        server: urahara
        container: trilium

    - OpenSpeedTest:
        icon: openspeedtest.png
        href: https://speedtest.lan.thalespm.me
        description: Network Speed Test
        server: zangetsu
        container: openspeedtest

    - Vikunja:
        icon: vikunja.png
        href: https://vikunja.lan.thalespm.me
        description: Task Management
        server: urahara
        container: vikunja

    - qBittorrent:
        icon: qbittorrent.png
        href: https://qbit.lan.thalespm.me
        description: Torrent Client
        server: urahara
        container: qbittorrent
        widget:
          type: qbittorrent
          url: http://192.168.15.215:8095
          username: "{{HOMEPAGE_VAR_QBITTORRENT_USER}}"
          password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"

    - Wolf:
        # Neither "wolf" nor "moonlight" is in Homepage's default icon pack
        # (dashboard-icons), so this uses Sunshine's (same Moonlight
        # protocol).
        icon: sunshine.png
        href: https://wolf.lan.thalespm.me
        description: Retro Game Streaming
        server: urahara
        container: wolf
