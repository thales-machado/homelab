services:
  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    cpus: 0.30
    mem_limit: 128m
    pids_limit: 64
    # Cross-host (CONVENTIONS.md): Traefik on zangetsu reaches it by IP:port -
    # a container name like "it-tools:80" only resolves same-host (the old
    # Caddy setup always 502'd on this).
    ports:
      - "192.168.15.215:8092:80"
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
    depends_on:
      dockflare-agent:
        condition: service_started
    networks:
      - cloudflare-net
    labels:
      dockflare.enable: "true"
      com.centurylinklabs.watchtower.enable: "true"
      dockflare.hostname: "it-tools.thalespm.me"
      dockflare.service: "http://it-tools:80"
