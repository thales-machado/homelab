# urahara-only override: pi-hole.yaml is host-agnostic; the static IP comes from
# PIHOLE_STATIC_IP in .env (Compose does not merge a nested ipv4_address across
# included files). Publishes port 80 on the LAN so Nebula Sync (zangetsu) can
# reach the API. app_sudo is required by Nebula Sync on replicas.
services:
  pi-hole:
    ports:
      - "192.168.15.215:80:80"
    environment:
      - FTLCONF_webserver_api_app_sudo=true
