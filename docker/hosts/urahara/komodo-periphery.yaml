# Its own Compose project on purpose: komodo-periphery must never share the
# "homelab" project with the Stack that Komodo itself deploys. Dropping it
# from the main include: is not enough - Komodo acts on the whole Compose
# project. Full incident in docs/komodo.md.
# Deploy by hand only, never through Komodo, and never with -f alongside
# compose.yaml:
#   cd docker/hosts/<host> && docker compose -f komodo-periphery.yaml up -d
name: komodo-periphery

networks:
  cloudflare-net:
    external: true

include:
  - ../../services/platform/management/komodo/periphery.yaml
  - komodo-periphery-port.yaml
